server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:ecompass;DB_CLOSE_DELAY=-1;MODE=MySQL
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

ecompass:
  code:
    # Example in wireframe: "FLOT P9X7 2KA3"
    prefix: ECOM
    separator: "-"
    groups: [2, 2]     # group sizes for random segments
    alphabet: "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"  # removed ambiguous 0,O,1,I
    max-retries: 20

  expiry:
    default-minutes: 59

  scheduler:
    expiry-sweep-ms: 60000
